    <script>
      /* ═══════════════════════════════════════════════════════════════
         LAN Share — 23.5s · 1920x1080 · 30fps
         Beat grid verified against the bundled cue sheet (114.84 BPM,
         interval 0.5225s). Strong-cue locks: 3.70 / 6.34 / 21.59.
         Each scene is a sub-composition driven on its own scene-local
         timeline; this root timeline only carries the audio bed, the SFX
         elements and the audio-reactive band sampler (a pure function of
         timeline time, seek-safe).
         ═══════════════════════════════════════════════════════════════ */
      var tl = gsap.timeline({ paused: true });

      (function reactive() {
        var A = window.HF_AUDIO_DATA;
        if (!A || !A.frames || !A.frames.length) return;
        var root = document.documentElement;
        var probe = { t: 0 };
        tl.to(
          probe,
          {
            t: A.totalFrames / A.fps,
            duration: A.totalFrames / A.fps,
            ease: 'none',
            onUpdate: function () {
              var i = Math.min(A.frames.length - 1, Math.max(0, Math.round(probe.t * A.fps)));
              var b = A.frames[i];
              root.style.setProperty('--bass', b[0].toFixed(3));
              root.style.setProperty('--mid', b[6].toFixed(3));
              root.style.setProperty('--treble', b[14].toFixed(3));
            },
          },
          0,
        );
      })();

      window.__timelines = window.__timelines || {};
      window.__timelines['root'] = tl;
      tl.seek(0);
    </script>
