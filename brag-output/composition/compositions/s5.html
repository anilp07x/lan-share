          tl.from('#s5-glow', { autoAlpha: 0, duration: 0.7, ease: 'power2.out' }, 3.38);

            { autoAlpha: 0, scaleX: 0 },
            { autoAlpha: 1, scaleX: 1, duration: 0.5, ease: 'power3.out' },
            3.58,
          );

          /* Strong cue 21.59 → a frase fecha o vídeo */
          tl.from('#s5-tag', { autoAlpha: 0, y: 28, duration: 0.5, ease: 'power3.out' }, 3.68);

          tl.to('#s5', { autoAlpha: 0, duration: 0.01 }, 5.56);
