<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <title>LAN Share — cena 3</title>
  </head>
  <body>
    <template>
      <style>
        #s3 .glow {
          position: absolute;
          left: 180px;
          top: 60px;
          width: 520px;
          height: 960px;
          background: radial-gradient(
            ellipse at 50% 40%,
            rgba(41, 151, 255, 0.2),
            rgba(41, 151, 255, 0) 70%
          );
        }
        #s3 .copy {
          position: absolute;
          left: 840px;
          top: 300px;
          width: 940px;
        }
        #s3 .copy h2 {
          font-size: 84px;
        }
        #s3 .copy .sub {
          margin-top: 34px;
          font-size: 30px;
          color: var(--muted);
        }
        #s3 .phone {
          position: absolute;
          left: 180px;
          top: 80px;
          width: 480px;
          height: 920px;
          background: #0a0a0c;
          border: 1px solid var(--border-2);
          border-radius: 56px;
          box-shadow: 0 70px 170px rgba(0, 0, 0, 0.75);
          overflow: hidden;
        }
        #s3 .notch {
          position: absolute;
          left: 50%;
          top: 14px;
          width: 148px;
          height: 30px;
          margin-left: -74px;
          border-radius: 999px;
          background: #000000;
          border: 1px solid #ffffff12;
        }
        #s3 .screen {
          position: absolute;
          inset: 62px 26px 26px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        #s3 .rail {
          display: flex;
          align-items: center;
          gap: 12px;
          font-size: 26px;
          font-weight: 600;
        }
        #s3 .rail i {
          width: 13px;
          height: 13px;
          border-radius: 50%;
          background: var(--success);
        }
        #s3 .railhint {
          font-size: 18px;
          line-height: 1.4;
          color: var(--muted);
        }
        #s3 .railblock {
          padding: 22px 24px;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 24px;
        }
        #s3 .rlab {
          font-size: 21px;
          color: var(--muted);
          margin-bottom: 14px;
        }
        #s3 .statrow {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 6px 0;
          font-size: 24px;
        }
        #s3 .statrow .icon {
          width: 24px;
          height: 24px;
          color: var(--primary);
        }
        #s3 .statrow b {
          font-weight: 600;
          min-width: 82px;
        }
        #s3 .statrow span {
          color: var(--muted);
        }
        #s3 .sep {
          height: 1px;
          background: var(--border);
        }
        #s3 .day {
          text-align: center;
          font-size: 18px;
          color: var(--muted);
        }
        #s3 .bub {
          max-width: 78%;
          padding: 16px 20px;
          border-radius: 22px;
          font-size: 25px;
          line-height: 1.35;
          background: var(--card);
          border: 1px solid var(--border);
          color: var(--fg);
        }
        #s3 .bub.me {
          align-self: flex-end;
          background: var(--primary);
          border-color: transparent;
          color: #ffffff;
        }
        #s3 .filecard {
          align-self: flex-start;
          display: flex;
          align-items: center;
          gap: 16px;
          width: 92%;
          padding: 18px 20px;
          background: var(--card);
          border: 1px solid var(--border-2);
          border-radius: 22px;
        }
        #s3 .filecard .thumb {
          width: 62px;
          height: 62px;
          border-radius: 16px;
          background: linear-gradient(140deg, #2997ff, #30d158);
          display: grid;
          place-items: center;
        }
        #s3 .filecard .thumb .icon {
          width: 30px;
          height: 30px;
          color: #0a0a0c;
        }
        #s3 .filecard b {
          display: block;
          font-size: 25px;
          font-weight: 600;
        }
        #s3 .filecard span {
          font-size: 20px;
          color: var(--muted);
        }
      </style>

      <div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
        <section id="s3" class="scene">
          <div id="s3-glow" class="glow"></div>

          <div id="s3-phone" class="phone">
            <div class="notch"></div>
            <div class="screen">
              <div id="s3-rail">
                <div class="rail"><i></i>Ligado</div>
                <div class="railhint">
                  Ligação activa. Tudo o que enviares aparece aqui e nos outros dispositivos.
                </div>
              </div>

              <div id="s3-stats" class="railblock">
                <div class="rlab">Nesta partilha</div>
                <div id="s3-s1" class="statrow">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5" />
                    <path d="m5 12 7-7 7 7" />
                  </svg>
                  <b id="s3-msgs">0</b><span>mensagem</span>
                </div>
                <div id="s3-s2" class="statrow">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                  </svg>
                  <b id="s3-files">0</b><span>ficheiro</span>
                </div>
                <div id="s3-s3" class="statrow">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" x2="12" y1="15" y2="3" />
                  </svg>
                  <b id="s3-size">0.0 MB</b><span>transferidos</span>
                </div>
              </div>

              <div id="s3-sep" class="sep"></div>
              <div id="s3-day" class="day">Hoje</div>

              <div id="s3-m1" class="bub">Já aí entraste?</div>
              <div id="s3-m2" class="bub me">Sim — a abrir agora.</div>

              <div id="s3-f1" class="filecard">
                <div class="thumb">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                    <circle cx="9" cy="9" r="2" />
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                  </svg>
                </div>
                <div>
                  <b>foto-da-praia.jpg</b>
                  <span>4.2 MB</span>
                </div>
              </div>
            </div>
          </div>

          <div id="s3-copy" class="copy">
            <h2>
              Mensagens em tempo real.<br /><span class="grad">Todos na LAN veem tudo.</span>
            </h2>
            <div class="sub">Sem cloud. Sem conta. Só a tua rede.</div>
          </div>
        </section>
      </div>

      <script>
        /* Cena 3 · 8.0–12.5 s. Tempos locais = globais − 8.
           Cues: strong 8.44 (copy), 9.50 (1.ª mensagem), 11.60 (ficheiro). */
        (function () {
          var tl = gsap.timeline({ paused: true });
          var msgs = { n: 0 };
          var files = { n: 0 };
          var size = { n: 0 };
          var elMsgs = document.getElementById('s3-msgs');
          var elFiles = document.getElementById('s3-files');
          var elSize = document.getElementById('s3-size');

          tl.from('#s3-glow', { autoAlpha: 0, duration: 0.6, ease: 'power2.out' }, 0);
          tl.from('#s3-phone', { autoAlpha: 0, y: 46, scale: 0.985, duration: 0.55, ease: 'power3.out' }, 0.2);
          tl.from('#s3-rail', { autoAlpha: 0, x: -18, duration: 0.36, ease: 'power2.out' }, 0.36);
          tl.from('#s3-stats', { autoAlpha: 0, y: 20, duration: 0.42, ease: 'power3.out' }, 0.6);
          tl.from('#s3-sep', { autoAlpha: 0, scaleX: 0.2, duration: 0.4, ease: 'power2.out' }, 0.68);
          tl.from('#s3-day', { autoAlpha: 0, duration: 0.3 }, 0.7);

          /* Strong cue 8.44 → headline */
          tl.from('#s3-copy', { autoAlpha: 0, x: 44, duration: 0.52, ease: 'power3.out' }, 0.44);

          /* Strong cue 9.50 → primeira mensagem + contador */
          tl.from('#s3-m1', { autoAlpha: 0, y: 26, scale: 0.96, duration: 0.42, ease: 'back.out(1.4)' }, 1.5);
          tl.to(msgs, {
            n: 1,
            duration: 0.5,
            ease: 'power2.out',
            onUpdate: function () {
              elMsgs.textContent = String(msgs.n);
            },
          }, 1.5);

          tl.from('#s3-m2', { autoAlpha: 0, y: 26, scale: 0.96, duration: 0.42, ease: 'back.out(1.4)' }, 2.54);

          /* Strong cue 11.60 → ficheiro + contadores */
          tl.from('#s3-f1', { autoAlpha: 0, y: 30, scale: 0.96, duration: 0.44, ease: 'back.out(1.4)' }, 3.6);
          tl.to(files, {
            n: 1,
            duration: 0.4,
            ease: 'power2.out',
            onUpdate: function () {
              elFiles.textContent = String(files.n);
            },
          }, 3.6);
          tl.to(size, {
            n: 4.2,
            duration: 0.9,
            ease: 'power1.out',
            onUpdate: function () {
              elSize.textContent = size.n.toFixed(1) + ' MB';
            },
          }, 3.62);

          tl.fromTo('#s3-stats', { scale: 1 }, { scale: 1.03, duration: 0.22, ease: 'power2.out' }, 4.02);
          tl.to('#s3-stats', { scale: 1, duration: 0.26, ease: 'power2.inOut' }, 4.24);

          /* Corte limpo para a cena 4. */

          window.__timelines = window.__timelines || {};
          window.__timelines['s3'] = tl;
          tl.to('#s3', { autoAlpha: 0, duration: 0.01 }, 4.47);
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
